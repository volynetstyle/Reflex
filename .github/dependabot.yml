version: 2
updates:
  # Workflow and composite actions are pinned to commit SHAs; this keeps the
  # pins current with their version comments.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # changesets/action v2 requires Changesets CLI v3; the repo is on v2.
      # Lift together with the @changesets/cli major.
      - dependency-name: changesets/action
        update-types: [version-update:semver-major]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore
