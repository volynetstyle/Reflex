name: Release qualification

# Continuous delivery, step 2 of 2. Qualifies the exact tarballs on Linux and
# Windows and, when asked, publishes the Linux-qualified archives byte for
# byte (tooling/configs/publish-qualified.mjs never rebuilds or repacks).
#
# Publication rules:
#   - only from main, only versions already committed (apply_versions: false);
#   - only after both platforms qualified;
#   - only through the "npm" environment (configure required reviewers and
#     the NPM_TOKEN secret on it in the repository settings).

on:
  workflow_dispatch:
    inputs:
      apply_versions:
        description: Apply the pending Changesets version plan before qualification (dry run; cannot publish)
        type: boolean
        default: true
      publish:
        description: Publish the qualified archives to npm (requires apply_versions = false and ref = main)
        type: boolean
        default: false
      dist_tag:
        description: npm dist-tag for publication
        type: string
        default: latest

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject publication of uncommitted or off-main versions
        if: inputs.publish
        env:
          APPLY_VERSIONS: ${{ inputs.apply_versions }}
          REF: ${{ github.ref }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [[ "$APPLY_VERSIONS" == true ]]; then
            echo "::error::publish requires apply_versions=false: merge the version pull request first"; exit 1
          fi
          if [[ "$REF" != refs/heads/main ]]; then
            echo "::error::publish runs only from main (got $REF)"; exit 1
          fi
          if [[ ! "$DIST_TAG" =~ ^[a-zA-Z][a-zA-Z0-9._-]*$ ]]; then
            echo "::error::invalid dist-tag '$DIST_TAG'"; exit 1
          fi

  qualify:
    name: versioned artifacts on ${{ matrix.os }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          chromium: "true"
      - name: Record and apply the version plan
        env:
          APPLY_VERSIONS: ${{ inputs.apply_versions }}
        run: |
          mkdir -p artifacts/release
          pnpm exec changeset status --output artifacts/release/version-plan.json
          if [[ "$APPLY_VERSIONS" == true ]]; then
            node -e 'const plan=require("./artifacts/release/version-plan.json");if(!plan.releases.length)throw new Error("A pending Changeset is required to prepare new release versions")'
            pnpm release:version:ci
            pnpm install --frozen-lockfile
          fi
      - name: Qualify all current semantic and package gates
        run: pnpm quality:check -- --phase release --output-dir artifacts/release-checks
      - name: Qualify the exact versioned tarballs
        run: pnpm test:consumer -- --output-dir artifacts/qualification
      - name: Verify approved archive identities without publishing
        run: |
          qualification=$(find artifacts/qualification -name qualification.json -print -quit)
          node tooling/configs/publish-qualified.mjs --qualification "$qualification" --quality-summary artifacts/release-checks/summary.json > artifacts/release/publication-verification.json
          cp package.json pnpm-lock.yaml artifacts/release/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: release-qualified-${{ runner.os }}-${{ github.sha }}
          path: |
            artifacts/release/
            artifacts/release-checks/
            artifacts/qualification/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish to npm
    needs: qualify
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write # release tags
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-qualified-Linux-${{ github.sha }}
          path: artifacts
      - name: Publish the qualified archives
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          qualification=$(find artifacts/qualification -name qualification.json -print -quit)
          node tooling/configs/publish-qualified.mjs --publish \
            --qualification "$qualification" \
            --quality-summary artifacts/release-checks/summary.json \
            --tag "$DIST_TAG" \
            --output-dir artifacts/publication
      - name: Tag the published versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          qualification=$(realpath "$(find artifacts/qualification -name qualification.json -print -quit)")
          node -e 'for (const p of require(process.argv[1]).packages) console.log(p.name + "@" + p.version)' "$qualification" |
            while read -r tag; do
              git rev-parse -q --verify "refs/tags/$tag" >/dev/null || git tag "$tag"
            done
          git push origin --tags
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: publication-${{ github.sha }}
          path: artifacts/publication/
          if-no-files-found: warn
          retention-days: 365
