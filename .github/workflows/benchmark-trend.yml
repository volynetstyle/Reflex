name: Benchmark trend

# Performance history against a fixed anchor (tooling/benchmarks/anchor.json).
#
#   measure   Every main push measures HEAD against the anchor in one job per
#             suite (B1 H1 H2 B2), so each point is a same-machine ratio that
#             stays comparable across hosted-runner hardware. The result is
#             judged against the history boundary; verdicts are reported, never
#             blocking. A suite whose subjects did not change since the previous
#             main head is skipped: its point would repeat the last one. Pull
#             requests are measured by benchmark-gate.yml against their base;
#             a second, anchored measurement of the same change adds nothing.
#   record    Main pushes append the point to the bench-data branch. Commits of
#             the last 14 days stay individual; older days compact to medians.
#   pages     The trend page is rebuilt from bench-data and deployed to Pages.
#
# See tooling/benchmarks/trend.mjs for the statistics.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/benchmark-trend.yml
      - pnpm-lock.yaml
      - tooling/build/**
      - tooling/benchmarks/**
      - third-party/algorithm-projection/**
      - packages/reflex-runtime/**
      - packages/reflex-scheduler/**
      - packages/reflex/**

permissions:
  contents: read

concurrency:
  group: benchmark-trend-${{ github.ref }}
  # Every main commit is a history point.
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
      any: ${{ steps.suites.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: suites
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          args=()
          # A push is compared with the previous main head; a dispatch, a new
          # branch or a force push measures every suite.
          if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git fetch -q --depth=1 origin "$BEFORE"; then args=(--base "$BEFORE" --head "$GITHUB_SHA"); fi
          plan=$(node tooling/benchmarks/plan.mjs "${args[@]}")
          echo "$plan" | tee -a "$GITHUB_OUTPUT"
          for suite in $(sed -n 's/^skipped=//p' <<< "$plan"); do
            echo "::notice title=$suite trend skipped::No measured source changed since the previous main head; the point would repeat the last one."
          done

  measure:
    name: ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    # Pinned image: the anchor is re-measured in every job, but the toolchain
    # around it should still change only deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      OUT: ${{ github.workspace }}/artifacts/${{ matrix.suite }}
    steps:
      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head

      - name: Resolve anchor and revisions
        id: revisions
        working-directory: head
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          anchor=$(node -p 'require("./tooling/benchmarks/anchor.json").commit')
          head=$(git rev-parse HEAD)
          scope="$REPOSITORY_ID:branch-$GITHUB_REF_NAME"
          {
            echo "anchor=$anchor"
            echo "head=$head"
            echo "scope=$scope"
            echo "timestamp=$(git show -s --format=%cI HEAD)"
            echo "measurable=$([[ "$anchor" != "$head" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout anchor
        if: steps.revisions.outputs.measurable == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revisions.outputs.anchor }}
          path: base

      - name: Checkout trend history
        if: steps.revisions.outputs.measurable == 'true'
        id: history
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: bench-data
          path: store

      - name: Setup pnpm
        if: steps.revisions.outputs.measurable == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: head/package.json

      - name: Setup Node
        if: steps.revisions.outputs.measurable == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            head/pnpm-lock.yaml

      - name: Install and build both subjects
        if: steps.revisions.outputs.measurable == 'true'
        run: |
          (cd base && pnpm install --frozen-lockfile)
          (cd head && pnpm install --frozen-lockfile)
          # The anchor builds each package with its own scripts, in dependency order.
          (cd base && pnpm --filter '@volynets/algorithm-projection' build \
            && pnpm --filter '@volynets/reflex-runtime' build \
            && pnpm --filter '@volynets/reflex-scheduler' build \
            && pnpm --filter '@volynets/reflex' build)
          (cd head && pnpm --filter '@volynets/reflex' build:all)

      - name: Qualify one transitive protocol on both revisions
        if: steps.revisions.outputs.measurable == 'true'
        id: protocol
        env:
          PROTOCOL_FILES: ${{ matrix.protocol }}
        run: |
          entries=$(echo "$PROTOCOL_FILES" | tr " " ",")
          node head/tooling/benchmarks/workflow-protocol.mjs --base-root base --head-root head --entries "$entries" --output-dir "$OUT/protocol"
          echo "hash=$(node -p "require('$OUT/protocol/protocol.json').protocolHash")" >> "$GITHUB_OUTPUT"

      - name: Read tool versions
        if: steps.revisions.outputs.measurable == 'true'
        id: tools
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          base_vitest=$(cd base && pnpm --filter "$PACKAGE" exec vitest --version)
          head_vitest=$(cd head && pnpm --filter "$PACKAGE" exec vitest --version)
          if [[ "$base_vitest" != "$head_vitest" ]]; then
            echo "::notice title=${{ matrix.suite }} trend skipped::Vitest differs between anchor and head ($base_vitest -> $head_vitest); re-anchor after the toolchain change"
            echo "comparable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "comparable=true"
            echo "vitest=$head_vitest"
            echo "pnpm=$(pnpm --version)"
          } >> "$GITHUB_OUTPUT"

      - name: Benchmark B1 H1 H2 B2
        if: steps.tools.outputs.comparable == 'true'
        env:
          PACKAGE: ${{ matrix.package }}
          FILES: ${{ matrix.files }}
        run: |
          for run in base:base-1 head:head-1 head:head-2 base:base-2; do
            # shellcheck disable=SC2086 # FILES is a list of bench files
            (cd "${run%%:*}" && pnpm --filter "$PACKAGE" exec vitest bench $FILES --run --outputJson "$OUT/${run##*:}.raw.json")
          done

      - name: Evaluate the anchored pairs
        if: steps.tools.outputs.comparable == 'true'
        working-directory: head
        # The edge gate lives in benchmark-gate.yml; here only the summary matters.
        continue-on-error: true
        run: >-
          pnpm bench:quality-gate --
          --suite '${{ matrix.suite }}'
          --base-commit '${{ steps.revisions.outputs.anchor }}'
          --anchor-commit '${{ steps.revisions.outputs.anchor }}'
          --head-commit '${{ steps.revisions.outputs.head }}'
          --head-timestamp '${{ steps.revisions.outputs.timestamp }}'
          --workflow-run-id '${{ github.run_id }}'
          --scope '${{ steps.revisions.outputs.scope }}'
          --protocol-hash '${{ steps.protocol.outputs.hash }}'
          --vitest-version '${{ steps.tools.outputs.vitest }}'
          --pnpm-version '${{ steps.tools.outputs.pnpm }}'
          --base-files "$OUT/base-1.raw.json,$OUT/base-2.raw.json"
          --head-files "$OUT/head-1.raw.json,$OUT/head-2.raw.json"
          --json "$OUT/summary.json"
          --markdown "$OUT/gate.md"
          --chart "$OUT/gate.svg"
          --migration-manifest "$OUT/protocol/migration.json"

      - name: Judge against the history boundary
        if: steps.tools.outputs.comparable == 'true' && hashFiles(format('artifacts/{0}/summary.json', matrix.suite)) != ''
        run: |
          mkdir -p store
          node head/tooling/benchmarks/trend.mjs judge --store store --summary "$OUT/summary.json" --report "$GITHUB_STEP_SUMMARY"

      - name: Upload the point
        if: always() && hashFiles(format('artifacts/{0}/summary.json', matrix.suite)) != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trend-${{ matrix.suite }}-${{ steps.revisions.outputs.head }}
          path: artifacts/${{ matrix.suite }}/
          retention-days: 90

  record:
    name: record history
    needs: measure
    if: always() && needs.measure.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      recorded: ${{ steps.ingest.outputs.recorded }}
    timeout-minutes: 10
    # One writer at a time; a queued record is never cancelled.
    concurrency:
      group: bench-data
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: trend-*-${{ github.sha }}
          path: points
      - name: Open the bench-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q store
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin bench-data; then git checkout -q -b bench-data FETCH_HEAD; else git checkout -q --orphan bench-data; fi
      - name: Ingest, compact and push
        id: ingest
        run: |
          shopt -s nullglob
          summaries=(points/*/summary.json)
          if (( ${#summaries[@]} == 0 )); then echo "No comparable points for ${GITHUB_SHA}"; exit 0; fi
          for summary in "${summaries[@]}"; do
            node head/tooling/benchmarks/trend.mjs ingest --store store --summary "$summary" --report "$GITHUB_STEP_SUMMARY"
          done
          cd store
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "bench: record ${GITHUB_SHA::12}"
          git push -q origin bench-data
          echo "recorded=true" >> "$GITHUB_OUTPUT"

  pages:
    name: deploy trend page
    needs: record
    # The page changes only when the history does.
    if: always() && needs.record.result == 'success' && needs.record.outputs.recorded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: head
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: bench-data
          path: store
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node head/tooling/benchmarks/trend.mjs site --store store --out site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
