name: CodeQL

# Static security analysis of the TypeScript sources and of the workflows
# themselves (injection, untrusted checkout, excessive permissions). Findings
# appear under Security → Code scanning.

# Pull requests into dev and main show new findings against their base; the
# push to main keeps the default-branch baseline that code scanning compares
# against. Documentation-only changes have nothing to analyze.
on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: '35 2 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/dist/**'
              - '**/build/**'
              - '**/node_modules/**'
              - 'bench-results/**'
              - 'experiments/**'
              - 'drafts/**'
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
