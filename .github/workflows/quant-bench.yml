name: Quant runtime experiment

# Research experiment packages/reflex-runtime-quant: its correctness suite on
# the CI platform, the structural counters, then the timing comparison of the
# quant runtime, Reflex (production bundle of the compared commit) and
# alien-signals in one job, so all three share one runner. Runs only for its
# own research branch; report-only edits (research/) do not re-run it.

on:
  push:
    branches: [research/quant-runtime]
    paths:
      - .github/workflows/quant-bench.yml
      - packages/reflex-runtime-quant/**
      - "!packages/reflex-runtime-quant/research/**"
  workflow_dispatch:
    inputs:
      rounds:
        description: Timing rounds (fresh process per runtime and scenario per round)
        required: false
        default: "9"

permissions:
  contents: read

concurrency:
  group: quant-bench-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  experiment:
    name: tests, structure, timing
    # Pinned image: a runner image change is not a code change.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Full history: the Reflex bundle is built from an archived commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-workspace

      - name: Tests (spec, Reflex and quant differential; invariants)
        working-directory: packages/reflex-runtime-quant
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        run: npx vitest run --config vitest.config.ts

      - name: Build bundles
        working-directory: packages/reflex-runtime-quant
        run: node bench/build.mjs

      - name: Structural counters
        working-directory: packages/reflex-runtime-quant
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          node bench/structure.mjs | tee "$GITHUB_WORKSPACE/artifacts/structure.md"
          cp .cache/bench/structure.json "$GITHUB_WORKSPACE/artifacts/"

      - name: Timing
        working-directory: packages/reflex-runtime-quant
        env:
          ROUNDS: ${{ inputs.rounds || '9' }}
        run: |
          node bench/run.mjs --rounds "$ROUNDS" --out "$GITHUB_WORKSPACE/artifacts/timing.json"
          {
            echo "## Quant vs Reflex vs alien-signals"
            echo
            cat "$GITHUB_WORKSPACE/artifacts/timing.md"
            echo
            echo "## Structural work per step"
            echo
            cat "$GITHUB_WORKSPACE/artifacts/structure.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quant-bench
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
