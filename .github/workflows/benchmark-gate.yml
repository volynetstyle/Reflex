name: Benchmark gate

# Vitest bench suites, base against head, in one job per suite (B1 H1 H2 B2).
# Hosted runners give a screening verdict: reported, never blocking; see
# tooling/benchmarks/enforce-gate.mjs. Not a required check.
#
# A measurement answers one question: did this change move the subject? It
# runs where a change enters a long-lived branch (a pull request into dev, or
# the dev -> main release candidate), never again on the push that merges it,
# and not at all for a suite whose subject sources are identical on both sides
# (only its benchmarks, tests or docs changed): that would time the same code
# twice and report noise.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Baseline revision
        required: false
        default: main
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/benchmark-gate.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/benchmark-quality-gate.ts
      - scripts/benchmark-history.ts
      - tooling/build/**
      - tooling/configs/**
      - tooling/benchmarks/**
      - third-party/algorithm-projection/**
      - packages/reflex-runtime/**
      - packages/reflex-scheduler/**
      - packages/reflex/**

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.revisions.outputs.base }}
      head: ${{ steps.revisions.outputs.head }}
      scope: ${{ steps.revisions.outputs.scope }}
      head_repository_id: ${{ steps.revisions.outputs.head_repository_id }}
      matrix: ${{ steps.suites.outputs.matrix }}
      any: ${{ steps.suites.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve revisions
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          DISPATCH_BASE: ${{ inputs.base }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          head=$GITHUB_SHA
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$PR_BASE scope="$PR_HEAD_REPOSITORY_ID:pr-$PR_NUMBER" head_repository_id=$PR_HEAD_REPOSITORY_ID
          else
            base=$DISPATCH_BASE scope="$REPOSITORY_ID:branch-$GITHUB_REF_NAME" head_repository_id=$REPOSITORY_ID
          fi
          # The shallow checkout holds only the head; plan.mjs compares trees, not files.
          git fetch -q --depth=1 origin "$base"
          base=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          {
            echo "base=$base"
            echo "head=$head"
            echo "scope=$scope"
            echo "head_repository_id=$head_repository_id"
          } >> "$GITHUB_OUTPUT"

      - name: Keep the suites whose subjects differ
        id: suites
        env:
          BASE: ${{ steps.revisions.outputs.base }}
          HEAD: ${{ steps.revisions.outputs.head }}
        run: |
          plan=$(node tooling/benchmarks/plan.mjs --base "$BASE" --head "$HEAD")
          echo "$plan" | tee -a "$GITHUB_OUTPUT"
          skipped=$(sed -n 's/^skipped=//p' <<< "$plan")
          for suite in $skipped; do
            echo "::notice title=$suite benchmarks skipped::No measured source differs between base and head (tooling/benchmarks/suites.json); timing identical code would only report noise."
          done

  benchmark:
    name: ${{ matrix.suite }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    # Pinned image: history charts compare runs over time.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.base }}
          path: base

      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.head }}
          path: head

      - name: Read head commit timestamp
        id: commit
        working-directory: head
        run: echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: head/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            head/pnpm-lock.yaml

      - name: Install base dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile

      - name: Install head dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile

      # The facade harness imports dist/esm; qualify and run against artifacts
      # built independently from each revision's own implementation.
      - name: Build base benchmark subjects
        working-directory: base
        run: |
          pnpm --filter '@volynets/algorithm-projection' build
          # Older revisions' build:all uses a Windows-only cleanup path guard.
          # Build each package with its own scripts, in dependency order.
          pnpm --filter '@volynets/reflex-runtime' build
          pnpm --filter '@volynets/reflex-scheduler' build
          pnpm --filter '@volynets/reflex' build

      - name: Build head benchmark subjects
        working-directory: head
        run: pnpm --filter '@volynets/reflex' build:all

      - name: Qualify one transitive protocol on both revisions
        id: protocol
        env:
          PROTOCOL_FILES: ${{ matrix.protocol }}
        run: |
          entries=$(echo "$PROTOCOL_FILES" | tr " " ",")
          node head/tooling/benchmarks/workflow-protocol.mjs --base-root base --head-root head --entries "$entries" --output-dir "artifacts/${{ matrix.suite }}/protocol"
          protocol_hash=$(node -p 'require("./artifacts/${{ matrix.suite }}/protocol/protocol.json").protocolHash')
          echo "hash=$protocol_hash" >> "$GITHUB_OUTPUT"

      - name: Read tool versions
        id: tools
        run: |
          base_vitest=$(cd base && pnpm --filter '${{ matrix.package }}' exec vitest --version)
          head_vitest=$(cd head && pnpm --filter '${{ matrix.package }}' exec vitest --version)
          # A toolchain bump (e.g. a Dependabot pull request) makes the two sides
          # incomparable by protocol; that is a fact to report, not a failure.
          if [[ "$base_vitest" != "$head_vitest" ]]; then
            echo "::notice title=${{ matrix.suite }} benchmarks skipped::Vitest differs between base and head ($base_vitest -> $head_vitest)"
            echo "comparable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "comparable=true"
            echo "vitest=$head_vitest"
            echo "pnpm=$(pnpm --version)"
          } >> "$GITHUB_OUTPUT"

      - name: Benchmark B1
        if: steps.tools.outputs.comparable == 'true'
        working-directory: base
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/base-1.raw.json'

      - name: Benchmark H1
        if: steps.tools.outputs.comparable == 'true'
        working-directory: head
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/head-1.raw.json'

      - name: Benchmark H2
        if: steps.tools.outputs.comparable == 'true'
        working-directory: head
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/head-2.raw.json'

      - name: Benchmark B2
        if: steps.tools.outputs.comparable == 'true'
        working-directory: base
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/base-2.raw.json'

      - name: Evaluate quality gate
        id: gate
        if: steps.tools.outputs.comparable == 'true'
        working-directory: head
        continue-on-error: true
        run: >-
          pnpm bench:quality-gate --
          --suite '${{ matrix.suite }}'
          --base-commit '${{ needs.plan.outputs.base }}'
          --head-commit '${{ needs.plan.outputs.head }}'
          --head-timestamp '${{ steps.commit.outputs.timestamp }}'
          --workflow-run-id '${{ github.run_id }}'
          --scope '${{ needs.plan.outputs.scope }}'
          --protocol-hash '${{ steps.protocol.outputs.hash }}'
          --vitest-version '${{ steps.tools.outputs.vitest }}'
          --pnpm-version '${{ steps.tools.outputs.pnpm }}'
          --base-files '../artifacts/${{ matrix.suite }}/base-1.raw.json,../artifacts/${{ matrix.suite }}/base-2.raw.json'
          --head-files '../artifacts/${{ matrix.suite }}/head-1.raw.json,../artifacts/${{ matrix.suite }}/head-2.raw.json'
          --json '../artifacts/${{ matrix.suite }}/summary.json'
          --markdown '../artifacts/${{ matrix.suite }}/summary.md'
          --chart '../artifacts/${{ matrix.suite }}/chart.svg'
          --migration-manifest '../artifacts/${{ matrix.suite }}/protocol/migration.json'
          --threshold 0.20
          --anomaly-threshold 0.50
          --max-rme 0.10
          --max-log-ratio-mad 0.10
          --min-samples 20

      - name: Add job summary
        if: always() && hashFiles(format('artifacts/{0}/summary.md', matrix.suite)) != ''
        run: cat 'artifacts/${{ matrix.suite }}/summary.md' >> "$GITHUB_STEP_SUMMARY"

      - name: Download previous benchmark artifacts
        if: always() && hashFiles(format('artifacts/{0}/summary.json', matrix.suite)) != ''
        working-directory: head
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PREFIX: benchmarks-${{ matrix.suite }}-
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT_HEAD_REPOSITORY_ID: ${{ needs.plan.outputs.head_repository_id }}
        run: |
          mkdir -p ../history
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.workflow_run.id, .name, .workflow_run.head_branch, .workflow_run.head_repository_id] | @tsv' |
            awk -v prefix="$ARTIFACT_PREFIX" -v branch="$CURRENT_BRANCH" -v repo="$CURRENT_HEAD_REPOSITORY_ID" '$2 ~ "^" prefix && $3 == branch && $4 == repo { print $1 "\t" $2 }' |
            head -n 60 > ../history/artifacts.tsv
          while IFS=$'\t' read -r run_id artifact_name; do
            [[ -z "$run_id" ]] && continue
            gh run download "$run_id" --name "$artifact_name" --dir "../history/$run_id" || true
          done < ../history/artifacts.tsv

      - name: Build benchmark history graph
        if: always() && hashFiles(format('artifacts/{0}/summary.json', matrix.suite)) != ''
        working-directory: head
        run: >-
          pnpm bench:history --
          --suite '${{ matrix.suite }}'
          --scope '${{ needs.plan.outputs.scope }}'
          --current '../artifacts/${{ matrix.suite }}/summary.json'
          --history-dir '../history'
          --json '../artifacts/${{ matrix.suite }}/history.json'
          --chart '../artifacts/${{ matrix.suite }}/history.svg'
          --timezone 'Europe/Kyiv'

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-${{ matrix.suite }}-${{ needs.plan.outputs.head }}
          path: artifacts/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 30

      # Screening verdicts become warnings; see tooling/benchmarks/enforce-gate.mjs.
      - name: Enforce quality gate
        if: steps.gate.outcome == 'failure'
        env:
          SUMMARY: artifacts/${{ matrix.suite }}/summary.json
          SUITE: ${{ matrix.suite }}
        run: node head/tooling/benchmarks/enforce-gate.mjs "$SUMMARY" "$SUITE"
