name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  registry:
    name: required coverage registry
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      phase: ${{ steps.matrix.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          phase=pr
          if [[ "$EVENT_NAME" == schedule ]]; then phase=deep; fi
          matrix=$(node tooling/configs/run-checks.mjs --list --phase "$phase")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

  static:
    name: tooling and config contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Checkout comparison baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          path: .quality-baseline
      - name: Install comparison baseline dependencies
        working-directory: .quality-baseline
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tooling lint
        run: pnpm exec eslint tooling config eslint.config.mjs vitest.config.ts
      - name: Required aggregate rejection contracts
        run: pnpm test:tooling
      - name: Resolved config and discovery parity
        run: pnpm check:configs -- --baseline-root .quality-baseline --output artifacts/config-equivalence.json
      - name: No active semantic divergence
        run: pnpm check:active-divergences
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: config-evidence
          path: artifacts/config-equivalence.json
          if-no-files-found: error

  quality:
    name: ${{ matrix.id }} checks
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.registry.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.browser
        run: pnpm --filter @volynets/reflex-dom exec playwright install --with-deps chromium
      - name: Run every registered prerequisite and check
        env:
          QUALITY_PACKAGE: ${{ matrix.package }}
          QUALITY_PHASE: ${{ needs.registry.outputs.phase }}
        run: pnpm quality:check -- --package "$QUALITY_PACKAGE" --phase "$QUALITY_PHASE" --output-dir artifacts/checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.id }}
          path: |
            artifacts/checks/
            packages/reflex-dom/**/__screenshots__/**
          if-no-files-found: error
          retention-days: 30

  consumer:
    name: installed package composition
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @volynets/reflex-dom exec playwright install --with-deps chromium
      - name: Build, pack, install and qualify declared exports
        run: pnpm test:consumer -- --output-dir artifacts/qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consumer-evidence
          path: artifacts/qualification/
          if-no-files-found: error
          retention-days: 90

  required:
    # Keep the former required status name while making it cover the entire matrix.
    name: fast checks
    if: always()
    needs: [registry, static, quality, consumer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: checks-*
          path: artifacts/checks
          merge-multiple: true
      - name: Enforce complete evidence and successful required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALITY_PHASE: ${{ needs.registry.outputs.phase || 'pr' }}
        run: |
          mkdir -p artifacts
          printf '%s' "$NEEDS_JSON" > artifacts/needs.json
          pnpm quality:aggregate -- --phase "$QUALITY_PHASE" --input-dir artifacts/checks --needs-json artifacts/needs.json --output artifacts/quality-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-quality-evidence
          path: artifacts/quality-summary.json
          if-no-files-found: error

  platform:
    name: clean consumer on Windows
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @volynets/reflex-dom exec playwright install chromium
      - run: pnpm test:consumer -- --output-dir artifacts/platform-qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-consumer-evidence
          path: artifacts/platform-qualification/
          if-no-files-found: error
