name: CI

on:
  workflow_dispatch:
  pull_request:
    # Labels gate overrides such as runtime-bundle-change, so re-check on them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are noise; main and nightly runs are evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Part of every evidence cache key: bump to invalidate all retained evidence.
  EVIDENCE_CACHE_VERSION: v1

jobs:
  registry:
    name: required coverage registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      phase: ${{ steps.matrix.outputs.phase }}
      consumer: ${{ steps.matrix.outputs.consumer }}
      reuse: ${{ steps.matrix.outputs.reuse }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # No pnpm in this job; setup-node would otherwise cache it from packageManager.
          package-manager-cache: false
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node tooling/configs/ci-fingerprints.mjs >> "$GITHUB_OUTPUT"

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  static:
    name: tooling and config contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Checkout comparison baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          path: .quality-baseline
          persist-credentials: false
      - name: Install comparison baseline dependencies
        working-directory: .quality-baseline
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tooling lint
        run: pnpm exec eslint tooling config eslint.config.mjs vitest.config.ts
      - name: Required aggregate rejection contracts
        run: pnpm test:tooling
      - name: Resolved config and discovery parity
        run: pnpm check:configs -- --baseline-root .quality-baseline --output artifacts/config-equivalence.json
      - name: No active semantic divergence
        run: pnpm check:active-divergences
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: config-evidence
          path: artifacts/config-equivalence.json
          if-no-files-found: error

  quality:
    name: ${{ matrix.id }} checks
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.registry.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Restore successful CI evidence
        id: evidence
        if: needs.registry.outputs.reuse == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: artifacts/checks
          key: ci-evidence-${{ env.EVIDENCE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9-${{ matrix.id }}-${{ needs.registry.outputs.phase }}-${{ matrix.fingerprint }}
      - uses: ./.github/actions/setup-workspace
        if: steps.evidence.outputs.cache-hit != 'true'
        with:
          chromium: ${{ matrix.browser && 'true' || 'false' }}
      - name: Run every registered prerequisite and check
        if: steps.evidence.outputs.cache-hit != 'true'
        env:
          QUALITY_PACKAGE: ${{ matrix.package }}
          QUALITY_PHASE: ${{ needs.registry.outputs.phase }}
          QUALITY_FINGERPRINT: ${{ matrix.fingerprint }}
        run: pnpm quality:check -- --package "$QUALITY_PACKAGE" --phase "$QUALITY_PHASE" --output-dir artifacts/checks
      - name: Retain successful CI evidence
        if: success() && needs.registry.outputs.reuse == 'true' && steps.evidence.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: artifacts/checks
          key: ci-evidence-${{ env.EVIDENCE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9-${{ matrix.id }}-${{ needs.registry.outputs.phase }}-${{ matrix.fingerprint }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: checks-${{ matrix.id }}
          path: |
            artifacts/checks/
            packages/reflex-dom/**/__screenshots__/**
          if-no-files-found: error
          retention-days: 30

  consumer:
    name: installed package composition
    needs: registry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Restore successful CI evidence
        id: evidence
        if: needs.registry.outputs.reuse == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: artifacts/qualification
          key: ci-evidence-${{ env.EVIDENCE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9-consumer-${{ needs.registry.outputs.consumer }}
      - uses: ./.github/actions/setup-workspace
        if: steps.evidence.outputs.cache-hit != 'true'
        with:
          chromium: "true"
      - name: Build, pack, install and qualify declared exports
        if: steps.evidence.outputs.cache-hit != 'true'
        run: pnpm test:consumer -- --output-dir artifacts/qualification
      - name: Retain successful CI evidence
        if: success() && needs.registry.outputs.reuse == 'true' && steps.evidence.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: artifacts/qualification
          key: ci-evidence-${{ env.EVIDENCE_CACHE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-node24-pnpm9-consumer-${{ needs.registry.outputs.consumer }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: consumer-evidence
          path: artifacts/qualification/
          if-no-files-found: error
          retention-days: 90

  # The core's machine code is the accepted performance baseline: the production
  # runtime bundle must stay byte-identical unless a reviewer approves a change.
  runtime-bundle:
    name: runtime bundle identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Compare the production bundle with the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'runtime-bundle-change') }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$PR_BASE ;;
            merge_group) base=$QUEUE_BASE ;;
            push) base=$PUSH_BASE ;;
            *) base=$(git rev-parse HEAD~1) ;;
          esac
          # A new branch or a force push has no comparable predecessor.
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          flags=()
          # Pushes to main already passed this check, approved or not, as a pull request.
          if [[ "$APPROVED" == "true" || "$EVENT_NAME" == "push" ]]; then flags+=(--allow-change); fi
          mkdir -p artifacts
          node tooling/configs/runtime-bundle-identity.mjs --base "$base" --head "$(git rev-parse HEAD)" --output artifacts/runtime-bundle.json "${flags[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: runtime-bundle-identity
          path: artifacts/runtime-bundle.json
          if-no-files-found: warn

  # New or changed dependencies with known vulnerabilities or a disallowed
  # license fail the pull request.
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never

  required:
    # Keep the former required status name while making it cover the entire matrix.
    name: fast checks
    if: always()
    needs: [registry, workflows, static, quality, consumer, runtime-bundle, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The aggregator uses only Node built-ins; no workspace install needed.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          # No pnpm in this job; setup-node would otherwise cache it from packageManager.
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: checks-*
          path: artifacts/checks
          merge-multiple: true
      - name: Enforce complete evidence and successful required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALITY_PHASE: ${{ needs.registry.outputs.phase || 'pr' }}
        run: |
          mkdir -p artifacts
          printf '%s' "$NEEDS_JSON" > artifacts/needs.json
          node tooling/configs/aggregate-checks.mjs --phase "$QUALITY_PHASE" --input-dir artifacts/checks --needs-json artifacts/needs.json --output artifacts/quality-summary.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: required-quality-evidence
          path: artifacts/quality-summary.json
          if-no-files-found: error

  # Release publication qualifies Windows too; nightly keeps it from rotting.
  platform:
    name: clean consumer on Windows
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          chromium: "true"
      - run: pnpm test:consumer -- --output-dir artifacts/platform-qualification
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: windows-consumer-evidence
          path: artifacts/platform-qualification/
          if-no-files-found: error

  # A failed nightly run has no pull request to block, so it opens (or
  # comments on) a tracking issue instead of failing silently.
  nightly-report:
    name: report nightly failure
    needs: [required, platform]
    if: always() && github.event_name == 'schedule' && (needs.required.result != 'success' || needs.platform.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly CI is failing"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled deep run failed: $RUN_URL"
          fi
