name: CI

# Correctness for every change, scaled by where it goes (.github/README.md):
#
#   pull request into dev     pr phase     the change itself
#   push to dev               pr phase     the integrated tip; free when the
#                                          merged pull request was up to date
#   pull request into main    deep phase   the release candidate
#   push to main              deep phase   free after the dev -> main pull request
#   nightly (Mon-Sat)         deep phase   dev; free when dev did not change
#   weekly (Sunday)           deep phase   dev, fresh: nothing reused, plus the
#                                          Windows consumer, so environment rot
#                                          and flaky tests still surface
#
# Nothing runs twice on the same inputs. Each package check is keyed by its
# input fingerprint (tooling/configs/ci-fingerprints.mjs) and a whole run by
# (phase, tree, base tree); a key that already passed in this repository is
# reused from its artifact instead of being executed again.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Quality phase
        type: choice
        options: [pr, deep]
        default: pr
      fresh:
        description: Execute every check even when evidence for the same inputs exists
        type: boolean
        default: false
  pull_request:
    # Labels gate overrides such as runtime-bundle-change, so re-check on them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev, main]
  merge_group:
  schedule:
    - cron: '20 1 * * 1-6'
    # The fresh run; keep in sync with FRESH_CRON below.
    - cron: '20 1 * * 0'

permissions:
  contents: read
  actions: read # find and download evidence of earlier runs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are noise; branch and nightly runs are evidence.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Part of every evidence name: bump to invalidate all retained evidence.
  EVIDENCE_VERSION: v2
  EVIDENCE_PLATFORM: linux-x64-node24-pnpm9
  # The release candidate: dev of this repository into main. Keep in sync with
  # the runtime-bundle job condition (env is not available there).
  DEV_TO_MAIN: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  registry:
    name: required coverage registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      phase: ${{ steps.plan.outputs.phase }}
      consumer: ${{ steps.matrix.outputs.consumer }}
      ref: ${{ steps.plan.outputs.ref }}
      base: ${{ steps.plan.outputs.base }}
      fresh: ${{ steps.plan.outputs.fresh }}
      key: ${{ steps.plan.outputs.key }}
      verified: ${{ steps.verified.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The schedule runs on the default branch; it verifies dev instead.
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No pnpm in this job; setup-node would otherwise cache it from packageManager.
          package-manager-cache: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          FRESH_CRON: '20 1 * * 0'
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_FRESH: ${{ inputs.fresh }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_REF: ${{ github.event.merge_group.base_ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head=$(git rev-parse HEAD)
          target=$GITHUB_REF_NAME base=$head
          case "$EVENT_NAME" in
            pull_request) target=$PR_BASE_REF base=$PR_BASE_SHA ;;
            merge_group) target=${QUEUE_BASE_REF#refs/heads/} base=$QUEUE_BASE_SHA ;;
            push) base=$PUSH_BEFORE ;;
          esac
          # A new branch or a force push has no comparable predecessor.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base=$head; fi

          case "$EVENT_NAME" in
            schedule) phase=deep ;;
            workflow_dispatch) phase=$INPUT_PHASE ;;
            *) if [[ "$target" == main ]]; then phase=deep; else phase=pr; fi ;;
          esac
          fresh=false
          if [[ "$INPUT_FRESH" == true || ( "$EVENT_NAME" == schedule && "$SCHEDULE" == "$FRESH_CRON" ) ]]; then fresh=true; fi

          # A run's verdict is a function of its phase, its tree and the tree it
          # is compared with (config parity, dependency review), so that tuple
          # names the evidence. The runtime bundle verdict also depends on
          # labels; that job is never reused.
          head_tree=$(git rev-parse 'HEAD^{tree}')
          if [[ "$base" == "$head" ]]; then base_tree=$head_tree
          else base_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$base" --jq .tree.sha) || base_tree="unknown-$GITHUB_RUN_ID"; fi
          key=$(printf '%s\n' "$EVIDENCE_VERSION" "$phase" "$head_tree" "$base_tree" | sha256sum | cut -c1-64)

          # Every job checks out the same commit, even if dev moves meanwhile;
          # other events check out their own commit by default.
          ref=
          if [[ "$EVENT_NAME" == schedule ]]; then ref=$head; fi

          {
            echo "phase=$phase"
            echo "base=$base"
            echo "fresh=$fresh"
            echo "key=$key"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT_NAME target=$target phase=$phase fresh=$fresh head=$head base=$base"
      - id: matrix
        env:
          QUALITY_PHASE: ${{ steps.plan.outputs.phase }}
        run: node tooling/configs/ci-fingerprints.mjs >> "$GITHUB_OUTPUT"
      - id: verified
        if: steps.plan.outputs.fresh != 'true'
        uses: ./.github/actions/restore-evidence
        with:
          name: ci-verified-${{ steps.plan.outputs.key }}
          token: ${{ github.token }}
      - name: Report reuse
        if: steps.verified.outputs.run-id != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.verified.outputs.run-id }}
        run: echo "::notice title=Verified inputs::The same phase, tree and base already passed in $RUN_URL; only checks that depend on more than the tree run again."

  workflows:
    name: workflow lint
    needs: registry
    if: needs.registry.outputs.verified == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.registry.outputs.ref }}
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color

  static:
    name: tooling and config contracts
    needs: registry
    if: needs.registry.outputs.verified == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.registry.outputs.ref }}
      - uses: ./.github/actions/setup-workspace
      - name: Checkout comparison baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.registry.outputs.base }}
          path: .quality-baseline
          persist-credentials: false
      - name: Install comparison baseline dependencies
        working-directory: .quality-baseline
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tooling lint
        run: pnpm exec eslint tooling config eslint.config.mjs vitest.config.ts
      - name: Required aggregate rejection contracts
        run: pnpm test:tooling
      - name: Resolved config and discovery parity
        run: pnpm check:configs -- --baseline-root .quality-baseline --output artifacts/config-equivalence.json
      - name: No active semantic divergence
        run: pnpm check:active-divergences
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: config-evidence
          path: artifacts/config-equivalence.json
          if-no-files-found: error

  quality:
    name: ${{ matrix.id }} checks
    needs: registry
    if: needs.registry.outputs.verified == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.registry.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.registry.outputs.ref }}
      - name: Restore successful CI evidence
        id: evidence
        if: needs.registry.outputs.fresh != 'true'
        uses: ./.github/actions/restore-evidence
        with:
          name: evidence-${{ env.EVIDENCE_VERSION }}-${{ env.EVIDENCE_PLATFORM }}-${{ matrix.id }}-${{ needs.registry.outputs.phase }}-${{ matrix.fingerprint }}
          path: artifacts/checks
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-workspace
        if: steps.evidence.outputs.hit != 'true'
        with:
          chromium: ${{ matrix.browser && 'true' || 'false' }}
      - name: Run every registered prerequisite and check
        if: steps.evidence.outputs.hit != 'true'
        env:
          QUALITY_PACKAGE: ${{ matrix.package }}
          QUALITY_PHASE: ${{ needs.registry.outputs.phase }}
          QUALITY_FINGERPRINT: ${{ matrix.fingerprint }}
        run: pnpm quality:check -- --package "$QUALITY_PACKAGE" --phase "$QUALITY_PHASE" --output-dir artifacts/checks
      - name: Retain successful CI evidence
        if: success() && steps.evidence.outputs.hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ env.EVIDENCE_VERSION }}-${{ env.EVIDENCE_PLATFORM }}-${{ matrix.id }}-${{ needs.registry.outputs.phase }}-${{ matrix.fingerprint }}
          path: artifacts/checks
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.id }}
          path: |
            artifacts/checks/
            packages/reflex-dom/**/__screenshots__/**
          if-no-files-found: error
          retention-days: 30

  consumer:
    name: installed package composition
    needs: registry
    if: needs.registry.outputs.verified == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.registry.outputs.ref }}
      - name: Restore successful CI evidence
        id: evidence
        if: needs.registry.outputs.fresh != 'true'
        uses: ./.github/actions/restore-evidence
        with:
          name: evidence-${{ env.EVIDENCE_VERSION }}-${{ env.EVIDENCE_PLATFORM }}-consumer-${{ needs.registry.outputs.consumer }}
          path: artifacts/qualification
          token: ${{ github.token }}
      - uses: ./.github/actions/setup-workspace
        if: steps.evidence.outputs.hit != 'true'
        with:
          chromium: "true"
      - name: Build, pack, install and qualify declared exports
        if: steps.evidence.outputs.hit != 'true'
        run: pnpm test:consumer -- --output-dir artifacts/qualification
      - name: Retain successful CI evidence
        if: success() && steps.evidence.outputs.hit != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ env.EVIDENCE_VERSION }}-${{ env.EVIDENCE_PLATFORM }}-consumer-${{ needs.registry.outputs.consumer }}
          path: artifacts/qualification
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: consumer-evidence
          path: artifacts/qualification/
          if-no-files-found: error
          retention-days: 90

  # The core's machine code is the accepted performance baseline: the production
  # runtime bundle must stay byte-identical unless a reviewer approves a change.
  # Approval happens where a change enters: a pull request into dev (label) or
  # straight into main. Pushes, the dev -> main pull request and the nightly
  # carry changes that were already judged here, so they do not run it.
  runtime-bundle:
    name: runtime bundle identity
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' &&
       !(github.base_ref == 'main' && github.head_ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
      - name: Compare the production bundle with the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'runtime-bundle-change') }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$PR_BASE ;;
            merge_group) base=$QUEUE_BASE ;;
          esac
          flags=()
          if [[ "$APPROVED" == "true" ]]; then flags+=(--allow-change); fi
          mkdir -p artifacts
          node tooling/configs/runtime-bundle-identity.mjs --base "$base" --head "$(git rev-parse HEAD)" --output artifacts/runtime-bundle.json "${flags[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-bundle-identity
          path: artifacts/runtime-bundle.json
          if-no-files-found: warn

  # New or changed dependencies with known vulnerabilities or a disallowed
  # license fail the pull request.
  dependency-review:
    name: dependency review
    needs: registry
    if: needs.registry.outputs.verified == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-3.0-only, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: never

  required:
    # Keep the former required status name while making it cover the entire matrix.
    name: fast checks
    # Runs when a required job failed or was skipped, so the status reports
    # it; not in a run cancelled as superseded, whose successor reports.
    if: ${{ !cancelled() }}
    needs: [registry, workflows, static, quality, consumer, runtime-bundle, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFIED: ${{ needs.registry.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.registry.outputs.ref }}
      # The aggregator uses only Node built-ins; no workspace install needed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No pnpm in this job; setup-node would otherwise cache it from packageManager.
          package-manager-cache: false

      - name: Adopt the verdict of the identical run
        if: env.VERIFIED != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-verified-${{ needs.registry.outputs.key }}
          path: artifacts
          run-id: ${{ env.VERIFIED }}
          github-token: ${{ github.token }}
      - name: Check the adopted verdict
        if: env.VERIFIED != ''
        env:
          QUALITY_PHASE: ${{ needs.registry.outputs.phase }}
        run: |
          node -e '
            const summary = require("./artifacts/quality-summary.json");
            if (summary.status !== "passed" || summary.phase !== process.env.QUALITY_PHASE) throw new Error("The adopted verdict is not a passed " + process.env.QUALITY_PHASE + " run");
          '
          echo "Adopted $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$VERIFIED"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.VERIFIED == ''
        with:
          pattern: checks-*
          path: artifacts/checks
          merge-multiple: true
      - name: Enforce complete evidence and successful required jobs
        if: env.VERIFIED == ''
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALITY_PHASE: ${{ needs.registry.outputs.phase || 'pr' }}
        run: |
          mkdir -p artifacts
          # The bundle verdict depends on labels, not only on the tree, so it is
          # judged below and kept out of the verdict that identical runs adopt.
          jq 'del(.["runtime-bundle"])' <<< "$NEEDS_JSON" > artifacts/needs.json
          node tooling/configs/aggregate-checks.mjs --phase "$QUALITY_PHASE" --input-dir artifacts/checks --needs-json artifacts/needs.json --output artifacts/quality-summary.json
      - name: Retain the verdict for identical inputs
        if: success() && env.VERIFIED == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-verified-${{ needs.registry.outputs.key }}
          path: artifacts/quality-summary.json
          if-no-files-found: error
          retention-days: 90

      - name: Runtime bundle identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULT: ${{ needs.runtime-bundle.result }}
        run: |
          expected=success
          if [[ ( "$EVENT_NAME" != pull_request && "$EVENT_NAME" != merge_group ) || "$DEV_TO_MAIN" == true ]]; then expected=skipped; fi
          if [[ "$RESULT" != "$expected" ]]; then echo "::error::runtime bundle identity: $RESULT (expected $expected)"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: required-quality-evidence
          path: artifacts/quality-summary.json
          if-no-files-found: error

  # Release publication qualifies Windows too; the weekly fresh run keeps it
  # from rotting.
  platform:
    name: clean consumer on Windows
    needs: registry
    if: github.event_name == 'schedule' && needs.registry.outputs.fresh == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.registry.outputs.ref }}
      - uses: ./.github/actions/setup-workspace
        with:
          chromium: "true"
      - run: pnpm test:consumer -- --output-dir artifacts/platform-qualification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-consumer-evidence
          path: artifacts/platform-qualification/
          if-no-files-found: error

  # A failed nightly run has no pull request to block, so it opens (or
  # comments on) a tracking issue instead of failing silently.
  nightly-report:
    name: report nightly failure
    needs: [required, platform]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.required.result != 'success' || !contains(fromJSON('["success", "skipped"]'), needs.platform.result))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly CI is failing"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled deep run of dev failed: $RUN_URL"
          fi
