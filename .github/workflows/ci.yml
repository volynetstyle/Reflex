name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - eslint.config.mjs
      - scripts/**
      - packages/reflex-runtime/**
      - packages/reflex-scheduler/**
      - packages/reflex/**

  pull_request:
    paths:
      - .github/workflows/ci.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - eslint.config.mjs
      - scripts/**
      - packages/reflex-runtime/**
      - packages/reflex-scheduler/**
      - packages/reflex/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Runtime lint
        run: pnpm --filter @volynets/reflex-runtime lint

      - name: Runtime typecheck
        run: pnpm --filter @volynets/reflex-runtime typecheck

      - name: Runtime test
        run: pnpm --filter @volynets/reflex-runtime test

      - name: Runtime dev test
        run: pnpm --filter @volynets/reflex-runtime test:dev

      - name: Runtime build
        run: pnpm --filter @volynets/reflex-runtime build

      - name: Scheduler lint
        run: pnpm --filter @volynets/reflex-scheduler lint

      - name: Scheduler typecheck
        run: pnpm --filter @volynets/reflex-scheduler typecheck

      - name: Scheduler test
        run: pnpm --filter @volynets/reflex-scheduler test

      - name: Scheduler build
        run: pnpm --filter @volynets/reflex-scheduler build

      - name: Reflex lint
        run: pnpm --filter @volynets/reflex lint

      - name: Reflex typecheck
        run: pnpm --filter @volynets/reflex typecheck

      - name: Reflex test
        run: pnpm --filter @volynets/reflex test

      - name: Reflex build
        run: pnpm --filter @volynets/reflex build