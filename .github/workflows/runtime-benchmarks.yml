name: Benchmark Quality Gate

on:
  workflow_dispatch:
    inputs:
      base:
        description: Baseline revision
        required: false
        default: main
  pull_request:
    paths:
      - .github/workflows/runtime-benchmarks.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/benchmark-quality-gate.ts
      - scripts/benchmark-history.ts
      - tooling/configs/**
      - tooling/benchmarks/**
      - packages/reflex-runtime/**
      - packages/reflex-scheduler/**
      - packages/reflex/**
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-benchmarks.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/benchmark-quality-gate.ts
      - scripts/benchmark-history.ts
      - tooling/configs/**
      - tooling/benchmarks/**
      - packages/reflex-runtime/**
      - packages/reflex-scheduler/**
      - packages/reflex/**

permissions:
  actions: read
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: reflex-runtime
            package: "@volynets/reflex-runtime"
            files: test/perf/runtime-taxonomy.bench.ts
            protocol: packages/reflex-runtime/test/perf/runtime-taxonomy.bench.ts packages/reflex-runtime/test/runtime.test_utils.ts packages/reflex-runtime/vite.config.ts
          - suite: reflex-scheduler
            package: "@volynets/reflex-scheduler"
            files: bench/hot-path.bench.ts bench/full-graph.bench.ts
            protocol: packages/reflex-scheduler/bench/hot-path.bench.ts packages/reflex-scheduler/bench/full-graph.bench.ts packages/reflex-scheduler/vite.config.ts
          - suite: reflex
            package: "@volynets/reflex"
            files: bench/reflex.bench.ts
            protocol: packages/reflex/bench/reflex.bench.ts packages/reflex/bench/shared.ts packages/reflex/bench/harnesses.ts packages/reflex/vite.config.ts

    steps:
      - name: Resolve revisions
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          PUSH_BASE: ${{ github.event.before }}
          DISPATCH_BASE: ${{ inputs.base }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          head=$GITHUB_SHA
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base=$PR_BASE scope="$PR_HEAD_REPOSITORY_ID:pr-$PR_NUMBER" head_repository_id=$PR_HEAD_REPOSITORY_ID
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            base=$DISPATCH_BASE scope="$REPOSITORY_ID:branch-$GITHUB_REF_NAME" head_repository_id=$REPOSITORY_ID
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BASE" =~ ^0+$ ]]; then
            base=$PUSH_BASE scope="$REPOSITORY_ID:branch-$GITHUB_REF_NAME" head_repository_id=$REPOSITORY_ID
          else
            echo "Cannot determine a baseline for event $EVENT_NAME"
            exit 1
          fi
          {
            echo "base=$base"
            echo "head=$head"
            echo "scope=$scope"
            echo "head_repository_id=$head_repository_id"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revisions.outputs.base }}
          path: base

      - name: Checkout head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.revisions.outputs.head }}
          path: head

      - name: Read head commit timestamp
        id: commit
        working-directory: head
        run: echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: head/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            head/pnpm-lock.yaml

      - name: Install base dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile

      - name: Install head dependencies
        working-directory: head
        run: pnpm install --frozen-lockfile

      # The facade harness imports dist/esm; qualify and run against artifacts
      # built independently from each revision's own implementation.
      - name: Build base benchmark subjects
        working-directory: base
        run: |
          pnpm --filter '@volynets/algorithm-projection' build
          # Older revisions' build:all uses a Windows-only cleanup path guard.
          # Build each package with its own scripts, in dependency order.
          pnpm --filter '@volynets/reflex-runtime' build
          pnpm --filter '@volynets/reflex-scheduler' build
          pnpm --filter '@volynets/reflex' build

      - name: Build head benchmark subjects
        working-directory: head
        run: pnpm --filter '@volynets/reflex' build:all

      - name: Qualify one transitive protocol on both revisions
        id: protocol
        env:
          PROTOCOL_FILES: ${{ matrix.protocol }}
        run: |
          entries=$(echo "$PROTOCOL_FILES" | tr " " ",")
          node head/tooling/benchmarks/workflow-protocol.mjs --base-root base --head-root head --entries "$entries" --output-dir "artifacts/${{ matrix.suite }}/protocol"
          protocol_hash=$(node -p 'require("./artifacts/${{ matrix.suite }}/protocol/protocol.json").protocolHash')
          echo "hash=$protocol_hash" >> "$GITHUB_OUTPUT"

      - name: Read tool versions
        id: tools
        run: |
          base_vitest=$(cd base && pnpm --filter '${{ matrix.package }}' exec vitest --version)
          head_vitest=$(cd head && pnpm --filter '${{ matrix.package }}' exec vitest --version)
          if [[ "$base_vitest" != "$head_vitest" ]]; then
            echo "Vitest version differs between base and head: $base_vitest != $head_vitest"
            exit 1
          fi
          echo "vitest=$head_vitest" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(pnpm --version)" >> "$GITHUB_OUTPUT"

      - name: Benchmark B1
        working-directory: base
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/base-1.raw.json'

      - name: Benchmark H1
        working-directory: head
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/head-1.raw.json'

      - name: Benchmark H2
        working-directory: head
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/head-2.raw.json'

      - name: Benchmark B2
        working-directory: base
        run: >-
          pnpm --filter '${{ matrix.package }}' exec vitest bench
          ${{ matrix.files }}
          --run --outputJson '${{ github.workspace }}/artifacts/${{ matrix.suite }}/base-2.raw.json'

      - name: Evaluate quality gate
        id: gate
        working-directory: head
        continue-on-error: true
        run: >-
          pnpm bench:quality-gate --
          --suite '${{ matrix.suite }}'
          --base-commit '${{ steps.revisions.outputs.base }}'
          --head-commit '${{ steps.revisions.outputs.head }}'
          --head-timestamp '${{ steps.commit.outputs.timestamp }}'
          --workflow-run-id '${{ github.run_id }}'
          --scope '${{ steps.revisions.outputs.scope }}'
          --protocol-hash '${{ steps.protocol.outputs.hash }}'
          --vitest-version '${{ steps.tools.outputs.vitest }}'
          --pnpm-version '${{ steps.tools.outputs.pnpm }}'
          --base-files '../artifacts/${{ matrix.suite }}/base-1.raw.json,../artifacts/${{ matrix.suite }}/base-2.raw.json'
          --head-files '../artifacts/${{ matrix.suite }}/head-1.raw.json,../artifacts/${{ matrix.suite }}/head-2.raw.json'
          --json '../artifacts/${{ matrix.suite }}/summary.json'
          --markdown '../artifacts/${{ matrix.suite }}/summary.md'
          --chart '../artifacts/${{ matrix.suite }}/chart.svg'
          --migration-manifest '../artifacts/${{ matrix.suite }}/protocol/migration.json'
          --threshold 0.20
          --anomaly-threshold 0.50
          --max-rme 0.10
          --max-log-ratio-mad 0.10
          --min-samples 20

      - name: Add job summary
        if: always() && hashFiles(format('artifacts/{0}/summary.md', matrix.suite)) != ''
        run: cat 'artifacts/${{ matrix.suite }}/summary.md' >> "$GITHUB_STEP_SUMMARY"

      - name: Download previous benchmark artifacts
        if: always() && hashFiles(format('artifacts/{0}/summary.json', matrix.suite)) != ''
        working-directory: head
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_PREFIX: benchmarks-${{ matrix.suite }}-
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT_HEAD_REPOSITORY_ID: ${{ steps.revisions.outputs.head_repository_id }}
        run: |
          mkdir -p ../history
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.workflow_run.id, .name, .workflow_run.head_branch, .workflow_run.head_repository_id] | @tsv' |
            awk -v prefix="$ARTIFACT_PREFIX" -v branch="$CURRENT_BRANCH" -v repo="$CURRENT_HEAD_REPOSITORY_ID" '$2 ~ "^" prefix && $3 == branch && $4 == repo { print $1 "\t" $2 }' |
            head -n 60 > ../history/artifacts.tsv
          while IFS=$'\t' read -r run_id artifact_name; do
            [[ -z "$run_id" ]] && continue
            gh run download "$run_id" --name "$artifact_name" --dir "../history/$run_id" || true
          done < ../history/artifacts.tsv

      - name: Build benchmark history graph
        if: always() && hashFiles(format('artifacts/{0}/summary.json', matrix.suite)) != ''
        working-directory: head
        run: >-
          pnpm bench:history --
          --suite '${{ matrix.suite }}'
          --scope '${{ steps.revisions.outputs.scope }}'
          --current '../artifacts/${{ matrix.suite }}/summary.json'
          --history-dir '../history'
          --json '../artifacts/${{ matrix.suite }}/history.json'
          --chart '../artifacts/${{ matrix.suite }}/history.svg'
          --timezone 'Europe/Kyiv'

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks-${{ matrix.suite }}-${{ steps.revisions.outputs.head }}
          path: artifacts/${{ matrix.suite }}/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce quality gate
        if: steps.gate.outcome == 'failure'
        run: exit 1
