name: Research - machine variance

# Is a paired verdict between builds a property of the builds or of the VM?
# Every job is an independent runner (the experimental unit); inside it the
# usual paired replicates. Pairs: the neutral tape against base, and two
# byte-different but semantically identical builds of base (one inert module
# statement each, research/build-variants) against base and each other.
# compare.mjs adds the same-bundle control (A vs A') to every pair.
on:
  push:
    branches: [research/machine-variance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-machine-variance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  machine:
    name: machine ${{ matrix.machine }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        machine: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch the build variants
        run: git fetch --no-tags origin research/build-variants
      - uses: ./.github/actions/setup-workspace
      - name: Compare
        working-directory: packages/reflex-runtime
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          lscpu | sed -n 's/^Model name: *//p' > "$GITHUB_WORKSPACE/artifacts/cpu.txt"
          W='^A\.(graph\.swap-pairs-fanout-3|track\.hub-duplicate|track\.shared-chaotic-64|track\.stable-8)$'
          for pair in "bf71877 9971d9f" "bf71877 811f48c" "811f48c 8919535"; do
            set -- $pair
            node bench/compare.mjs --baseline "$1" --candidate "$2" \
              --workloads "$W" --family 4 --replicates 12 --fail-on none \
              --out "$GITHUB_WORKSPACE/artifacts/$1-$2.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: machine-${{ matrix.machine }}
          path: artifacts/
