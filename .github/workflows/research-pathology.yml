name: Research - pathology sentinels

# Workloads of the runtime (packages/reflex-runtime/perf/pathology). One job,
# three bundles timed alternately on the same runner: the current runtime,
# no tape prepare, and prepare without the absence certificate.
on:
  push:
    branches: [research/pathology-sentinels]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pathology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - name: Build bundles
        working-directory: packages/reflex-runtime
        run: |
          B=perf/pathology/bundles
          node scripts/build-baseline-oracle.mjs --source --production --out $B/current
          node scripts/build-baseline-oracle.mjs --source --production --out $B/no-tape \
            --mutate "src/kernel/shape/graph/tape.ts::  prepareTape(consumer, passStamp);::  return false;"
          node scripts/build-baseline-oracle.mjs --source --production --out $B/no-cert \
            --mutate "src/kernel/shape/graph/tape.ts::    hasFullTapeCoverage &&::    false &&"
          sha256sum $B/*/runtime.mjs | tee "$RUNNER_TEMP/bundles.txt"

      - name: Discovery
        working-directory: packages/reflex-runtime
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          B=perf/pathology/bundles
          node perf/pathology/compare.mjs --suite discovery             --bundles $B/current,$B/no-tape,$B/no-cert --names current,no-tape,no-cert             --json "$GITHUB_WORKSPACE/out/discovery.json" | tee "$GITHUB_WORKSPACE/out/discovery.md"

      - name: Summary
        if: always()
        run: |
          {
            echo "Node $(node --version), $(lscpu | sed -n 's/^Model name: *//p')"
            echo
            echo '```'; cat "$RUNNER_TEMP/bundles.txt"; echo '```'
            echo; echo "## Discovery"; echo
            cat out/discovery.md || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pathology-paired
          path: out/
