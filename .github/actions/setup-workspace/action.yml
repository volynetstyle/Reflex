name: Set up workspace
description: >-
  pnpm (from packageManager), Node with the pnpm store cache, a frozen install
  and, optionally, a cached Playwright Chromium.

inputs:
  node-version:
    description: Node.js version used by every pipeline.
    default: "24"
  working-directory:
    description: Workspace root to install (a second checkout, for baselines).
    default: .
  install-args:
    description: Extra arguments for pnpm install.
    default: ""
  chromium:
    description: Install Playwright Chromium for @volynets/reflex-dom.
    default: "false"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: pnpm install --frozen-lockfile $INSTALL_ARGS

    - name: Resolve Playwright version
      id: playwright
      if: inputs.chromium == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        version=$(pnpm --filter @volynets/reflex-dom exec playwright --version | awk '{print $2}')
        echo "version=$version" >> "$GITHUB_OUTPUT"
        if [[ "$RUNNER_OS" == Windows ]]; then
          echo "path=$LOCALAPPDATA\ms-playwright" >> "$GITHUB_OUTPUT"
        else
          echo "path=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache Playwright browsers
      id: browsers
      if: inputs.chromium == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.playwright.outputs.path }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

    - name: Install Chromium
      if: inputs.chromium == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ "$RUNNER_OS" == Linux ]]; then deps=--with-deps; else deps=; fi
        pnpm --filter @volynets/reflex-dom exec playwright install $deps chromium

    # Cached browsers still need the system libraries on a fresh Linux image.
    - name: Install Chromium system dependencies
      if: inputs.chromium == 'true' && steps.browsers.outputs.cache-hit == 'true' && runner.os == 'Linux'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm --filter @volynets/reflex-dom exec playwright install-deps chromium
